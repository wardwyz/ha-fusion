title: apple-home
name: Apple Home
author: Nova Domus
attribution: Inspired by the Apple Home app
theme:
  colors-background: '#111214'
  colors-text: '#f5f5f7'
  colors-icon: '#f5f5f7'
  colors-title: '#ffffff'
  colors-sidebar-border: 1px solid rgba(255, 255, 255, 0.08)
  colors-sidebar-background: rgba(28, 28, 30, 0.82)
  sizes-sidebar-time: 3.4rem
  background-image: 'radial-gradient(ellipse at 50% -15%, #343538 0%, #1a1b1d 48%, #111214 100%)'
  font-family: "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter Variable', system-ui"
  button-background-color-on: rgba(255, 255, 255, 0.14)
  button-background-color-off: rgba(255, 255, 255, 0.08)
  drawer-button-background-color: rgba(255, 255, 255, 0.08)
  button-name-color-on: '#ffffff'
  button-name-color-off: '#f5f5f7'
  button-state-color-on: rgba(245, 245, 247, 0.72)
  button-state-color-off: rgba(235, 235, 245, 0.62)
  modal-background-color: rgba(0, 0, 0, 0.5)
  border-radius: 1.15rem
  card-radius: 1.15rem
  card-border: 1px solid rgba(255, 255, 255, 0.07)
  card-shadow: 0 10px 28px rgba(0, 0, 0, 0.24)
  card-backdrop-filter: blur(18px) saturate(1.2)
  card-overflow: hidden
  card-active-scale: 0.985
  sidebar-font-size: 1rem
  sidebar-item-padding: 0.7rem 0.75rem
  sidebar-padding: 0 1.4rem
  drawer-font-size: 0.95rem
  sidebar-divider: 1px solid rgba(255, 255, 255, 0.09)
  navigate-background-color: rgba(255, 255, 255, 0.13)
  app-color: '#111214'
  modal-background-color-modal: rgb(30 30 32 / 88%)
  modal-background-color-sticky: rgb(30 30 32)
